<!DOCTYPE html>

<html>

<head>
    <title>Countdown ❤️</title>

    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>



<div class="container">

<div class="card">


<h2>Operation Alone Time</h2>


<div id="countdown">

    <div class="time-box">
        <span id="days">0</span>
        <small>days</small>
    </div>

    <div class="time-box">
        <span id="hours">0</span>
        <small>hrs</small>
    </div>

    <div class="time-box">
        <span id="minutes">0</span>
        <small>min</small>
    </div>

    <div class="time-box">
        <span id="seconds">0</span>
        <small>sec</small>
    </div>

</div>

<p>
A countdown for when we have each other all to ourselves 😇
</p>

<button id="secretButton">
    💌 Secret message
</button>

<p id="secretMessage"></p>

</div>

</div>

<script src="script.js"></script>


</body>

</html>
